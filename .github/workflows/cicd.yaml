name: Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: checkout the repository
        uses: actions/checkout@v2

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Docker build
        run: |
          echo "${{ vars.APPLICATIONS_PROPERTIES }}" > application.properties
          ls -la
          cat application.properties
          docker build -t netflix_backend:latest .

      - name: Docker push
        run: |
          docker tag netflix_backend:latest 666729139235.dkr.ecr.us-east-1.amazonaws.com/netflix_backend:${GITHUB_RUN_NUMBER}
          docker push 666729139235.dkr.ecr.us-east-1.amazonaws.com/netflix_backend:${GITHUB_RUN_NUMBER}